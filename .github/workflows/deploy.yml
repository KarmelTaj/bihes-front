name: Deploy

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-develop
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Debug node
        shell: bash
        run: |
          whoami
          echo "HOME=$HOME"
          command -v node || true
          command -v npm || true
          ls -la "$HOME/.nvm" || true

      - name: Pull, build, and restart
        shell: bash
        run: |
          set -e

          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

          nvm use 20

          cd /var/www/react-front

          git fetch origin develop
          git reset --hard origin/develop

          cd /var/www/react-front/bihes-front

          npm ci
          npm run build

          sudo systemctl reload nginx